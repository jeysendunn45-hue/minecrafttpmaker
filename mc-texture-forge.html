<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TexForge – AI Minecraft Texture Pack Maker (Groq)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#14161b;--panel:#1d2027;--line:#2c313b;--tx:#e6e8ec;--mut:#8b93a3;--acc:#5fd35f;--err:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
header h1{margin:0;font-size:18px;letter-spacing:.5px}
header span{color:var(--mut)}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
input,select,textarea,button{font:inherit;color:var(--tx);background:#12141a;border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer;background:#262b35;width:auto}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#0b1a0b;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:230px;overflow:auto;padding:2px}
.chip{display:flex;align-items:center;gap:5px;background:#12141a;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;user-select:none}
.chip input{width:auto;margin:0}
.chip.on{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#12141a;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.card canvas{width:128px;height:128px;image-rendering:pixelated;background:
 conic-gradient(#2a2d35 25%,#1f2229 0 50%,#2a2d35 0 75%,#1f2229 0) 0 0/16px 16px;border-radius:4px}
.card .nm{font-size:12px;margin:6px 0 4px;word-break:break-all}
.card .st{font-size:11px;color:var(--mut);min-height:14px}
.card .st.err{color:var(--err)}
.card button{padding:3px 8px;font-size:11px}
.palette{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.palette i{width:18px;height:18px;border-radius:3px;border:1px solid #0006}
#log{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--mut);max-height:90px;overflow:auto;margin-top:8px;white-space:pre-wrap}
.bar{height:6px;background:#12141a;border-radius:3px;overflow:hidden;margin-top:8px}
.bar div{height:100%;width:0;background:var(--acc);transition:width .2s}
small{color:var(--mut)}
</style>
</head>
<body>
<header><h1>⛏ TexForge</h1><span>AI Minecraft texture pack maker · powered by Groq</span></header>
<main>
<div>
  <div class="panel">
    <h2>1 · Groq</h2>
    <label>API key (stays in this browser's localStorage)</label>
    <input id="key" type="password" placeholder="gsk_..." autocomplete="off">
    <label>Model</label>
    <div class="row">
      <select id="model">
        <option>llama-3.3-70b-versatile</option>
        <option>openai/gpt-oss-120b</option>
        <option>openai/gpt-oss-20b</option>
        <option>llama-3.1-8b-instant</option>
      </select>
    </div>
    <label>…or type any Groq model id (overrides the list)</label>
    <input id="modelCustom" placeholder="optional">
    <button id="test" style="margin-top:10px">Test connection</button>
  </div>

  <div class="panel" style="margin-top:12px">
    <h2>2 · Pack</h2>
    <label>Pack name</label>
    <input id="packName" value="My AI Pack">
    <label>Theme / style prompt</label>
    <textarea id="theme">Dark gothic castle: cold blue-grey stone, aged iron, deep crimson accents, gritty hand-painted pixel art</textarea>
    <div class="row">
      <div><label>Minecraft version</label>
        <select id="ver">
          <option value="13">1.19.4 (13)</option>
          <option value="15" selected>1.20.1 (15)</option>
          <option value="18">1.20.2 (18)</option>
          <option value="22">1.20.4 (22)</option>
          <option value="34">1.21.1 (34)</option>
        </select></div>
      <div><label>Resolution</label>
        <select id="res"><option value="16" selected>16×16</option><option value="32">32×32</option></select></div>
    </div>
    <label>Temperature: <span id="tv">0.7</span></label>
    <input type="range" id="temp" min="0" max="1.2" step="0.05" value="0.7">
    <label class="row" style="margin-top:10px;color:var(--tx)"><input type="checkbox" id="useStyle" checked style="flex:0 0 auto;width:auto"> Generate a shared color palette first (more consistent pack)</label>
    <div class="palette" id="stylePal"></div>
  </div>

  <div class="panel" style="margin-top:12px">
    <h2>3 · Textures</h2>
    <div class="row" style="margin-bottom:8px">
      <button id="all">All</button><button id="none">None</button><button id="blocks">Blocks</button><button id="items">Items</button>
    </div>
    <div class="chips" id="chips"></div>
    <label>Add custom texture (e.g. <code>block/deepslate</code> or <code>item/netherite_axe</code>)</label>
    <div class="row"><input id="custom" placeholder="block/name or item/name"><button id="addCustom" style="flex:0 0 auto">Add</button></div>
  </div>

  <div class="panel" style="margin-top:12px">
    <button class="primary" id="gen" style="width:100%">Generate selected</button>
    <div class="row" style="margin-top:8px"><button id="stop" disabled>Stop</button><button id="dl" disabled>Download pack (.zip)</button></div>
    <div class="bar"><div id="prog"></div></div>
    <div id="log"></div>
  </div>
</div>

<div class="panel">
  <h2>Preview</h2>
  <small>Textures appear here as they generate. Add a note under a card and hit ↻ to redo just that one. Biome-tinted textures (grass top, leaves) should stay greyscale-ish since the game colours them.</small>
  <div class="grid" id="grid" style="margin-top:12px"></div>
</div>
</main>

<script>
const BLOCKS=["stone","dirt","grass_block_top","grass_block_side","cobblestone","oak_planks","oak_log","oak_log_top","sand","gravel","glass","bricks","oak_leaves","iron_ore","gold_ore","diamond_ore","coal_ore","netherrack","obsidian","bookshelf","crafting_table_top","furnace_front","tnt_side","glowstone"];
const ITEMS=["diamond_sword","iron_sword","iron_pickaxe","diamond_pickaxe","apple","bread","stick","coal","diamond","iron_ingot","gold_ingot","bow","arrow","torch"];
const $=id=>document.getElementById(id);
const tex={};      // "block/stone" -> {w, px:Uint8ClampedArray, palette:[], status, err, note}
const selected=new Set();
let stylePalette=null, stopFlag=false, running=false;

/* ---------- UI setup ---------- */
$("key").value=localStorage.getItem("tf_key")||"";
$("key").addEventListener("input",e=>localStorage.setItem("tf_key",e.target.value.trim()));
$("temp").addEventListener("input",e=>$("tv").textContent=e.target.value);
for(const k of ["tf_theme","tf_name","tf_model"]){}
if(localStorage.getItem("tf_theme"))$("theme").value=localStorage.getItem("tf_theme");
$("theme").addEventListener("input",e=>localStorage.setItem("tf_theme",e.target.value));
if(localStorage.getItem("tf_model"))$("model").value=localStorage.getItem("tf_model");
$("model").addEventListener("change",e=>localStorage.setItem("tf_model",e.target.value));

function allNames(){return [...BLOCKS.map(n=>"block/"+n),...ITEMS.map(n=>"item/"+n),...Object.keys(tex).filter(n=>!BLOCKS.includes(n.slice(6))&&!ITEMS.includes(n.slice(5)))]}
const extra=new Set();
function renderChips(){
  const box=$("chips");box.innerHTML="";
  const names=[...BLOCKS.map(n=>"block/"+n),...ITEMS.map(n=>"item/"+n),...extra];
  for(const n of names){
    const c=document.createElement("label");c.className="chip"+(selected.has(n)?" on":"");
    c.innerHTML=`<input type="checkbox" ${selected.has(n)?"checked":""}>${n}`;
    c.querySelector("input").onchange=e=>{e.target.checked?selected.add(n):selected.delete(n);c.classList.toggle("on",e.target.checked)};
    box.appendChild(c);
  }
}
$("all").onclick=()=>{[...BLOCKS.map(n=>"block/"+n),...ITEMS.map(n=>"item/"+n),...extra].forEach(n=>selected.add(n));renderChips()};
$("none").onclick=()=>{selected.clear();renderChips()};
$("blocks").onclick=()=>{selected.clear();BLOCKS.forEach(n=>selected.add("block/"+n));extra.forEach(n=>n.startsWith("block/")&&selected.add(n));renderChips()};
$("items").onclick=()=>{selected.clear();ITEMS.forEach(n=>selected.add("item/"+n));extra.forEach(n=>n.startsWith("item/")&&selected.add(n));renderChips()};
$("addCustom").onclick=()=>{
  let v=$("custom").value.trim().toLowerCase().replace(/\s+/g,"_");
  if(!/^(block|item)\/[a-z0-9_]+$/.test(v)){log("Custom name must look like block/name or item/name");return}
  if(!BLOCKS.includes(v.slice(6))&&!ITEMS.includes(v.slice(5)))extra.add(v);
  selected.add(v);$("custom").value="";renderChips();
};
BLOCKS.slice(0,6).forEach(n=>selected.add("block/"+n));["diamond_sword","iron_pickaxe","apple"].forEach(n=>selected.add("item/"+n));
renderChips();

function log(m){const l=$("log");l.textContent+=m+"\n";l.scrollTop=l.scrollHeight}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const modelId=()=>$("modelCustom").value.trim()||$("model").value;

/* ---------- Groq ---------- */
async function groq(messages,{json=true}={}){
  const key=$("key").value.trim();
  if(!key)throw new Error("Enter your Groq API key first");
  let useJson=json;
  for(let attempt=0;attempt<5;attempt++){
    if(stopFlag)throw new Error("Stopped");
    const body={model:modelId(),messages,temperature:+$("temp").value,max_tokens:2500};
    if(useJson)body.response_format={type:"json_object"};
    let res;
    try{
      res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify(body)});
    }catch(e){throw new Error(`Couldn't reach api.groq.com (${e.message}). Page origin: ${location.protocol}//${location.host||"(none)"}. Causes: opened inside a sandboxed preview/in-app viewer, an ad/privacy blocker or VPN/firewall blocking api.groq.com, or a content:// URL. Try a normal desktop browser tab or host the file on https (GitHub Pages).`)}
    if(res.status===429||res.status>=500){
      const ra=parseFloat(res.headers.get("retry-after"))||Math.min(4*(attempt+1),20);
      log(`Rate limited/busy (${res.status}) – waiting ${ra.toFixed(0)}s…`);await sleep(ra*1000+250);continue;
    }
    const data=await res.json().catch(()=>({}));
    if(!res.ok){
      const msg=data.error?.message||res.statusText;
      if(res.status===400&&useJson&&/response_format|json/i.test(msg)){useJson=false;continue}
      throw new Error(`Groq ${res.status}: ${msg}`);
    }
    return data.choices?.[0]?.message?.content||"";
  }
  throw new Error("Groq kept failing after retries");
}
function parseJSON(t){
  const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a<0||b<0)throw new Error("No JSON in reply");
  return JSON.parse(t.slice(a,b+1));
}
const hexOk=h=>/^#?[0-9a-f]{6}$/i.test(h);
const normHex=h=>(h[0]==="#"?h:"#"+h).toLowerCase();

async function makeStyle(){
  const theme=$("theme").value.trim();
  const out=await groq([
    {role:"system",content:"You are a Minecraft resource-pack art director. Reply with JSON only."},
    {role:"user",content:`Theme: "${theme}"\nCreate a cohesive shared palette of 12-16 colors for a 16-bit style Minecraft texture pack, ordered dark to light, including a few accent hues. Reply as {"palette":["#rrggbb",...],"notes":"one sentence of style rules (outline, shading direction, noise level)"}`}
  ]);
  const j=parseJSON(out);
  const pal=(j.palette||[]).filter(hexOk).map(normHex).slice(0,16);
  if(pal.length<4)throw new Error("Model returned a bad palette");
  stylePalette={palette:pal,notes:String(j.notes||"")};
  $("stylePal").innerHTML=pal.map(c=>`<i style="background:${c}" title="${c}"></i>`).join("");
  log("Style palette ready: "+stylePalette.notes);
}

/* ---------- Texture generation ---------- */
const HEXCHARS="0123456789abcdef";
function describe(name){
  const [kind,base]=name.split("/");
  const nice=base.replace(/_/g," ");
  const tileable=kind==="block"&&!/side|front|ore|bookshelf|table|tnt|top/.test(base)||/^(stone|dirt|sand|gravel|cobblestone|oak_planks|netherrack|obsidian|bricks|glowstone|oak_leaves)$/.test(base);
  let hint=kind==="block"
    ? `a Minecraft BLOCK face texture for "${nice}". Fill the whole square (no transparency except glass/leaves holes).${tileable?" It must tile seamlessly: left edge continues into right edge, top into bottom.":""}`
    : `a Minecraft ITEM sprite for "${nice}". Transparent background ('.'), drawn diagonally like vanilla tools/weapons where applicable (handle bottom-left, head top-right), 1px darker outline.`;
  if(/grass_block_top|oak_leaves/.test(base))hint+=" This texture is tinted by the biome colour in-game, so draw it in neutral light GREY shades (no green).";
  return hint;
}
async function genTexture(name){
  const N=+$("res").value, t=tex[name]||(tex[name]={});
  t.status="working";t.err=null;draw(name);
  const palRule=stylePalette?`Use ONLY colors from this shared palette (you may add up to 3 extra shades if needed): ${stylePalette.palette.join(", ")}. Style notes: ${stylePalette.notes}`:"Pick your own small palette (6-12 colors).";
  const prompt=`Theme: "${$("theme").value.trim()}"\nDraw ${describe(name)}\n${palRule}\n${t.note?`Extra direction: ${t.note}\n`:""}\nCanvas: exactly ${N} columns by ${N} rows.\nReply with JSON only:\n{"palette":["#rrggbb",...up to 16 colors],"rows":[${N} strings, each exactly ${N} characters]}\nEach character in a row is a palette index in hex (0-9,a-f) or '.' for transparent. Row 0 is the top. Use shading, highlights and texture noise like vanilla Minecraft. Count characters carefully.`;
  const out=await groq([
    {role:"system",content:"You are an expert Minecraft pixel artist who outputs pixel art as strict JSON palette-index grids."},
    {role:"user",content:prompt}]);
  const j=parseJSON(out);
  const pal=(j.palette||[]).filter(hexOk).map(normHex).slice(0,16);
  if(!pal.length)throw new Error("no palette");
  const rows=Array.isArray(j.rows)?j.rows.map(String):[];
  if(rows.length<N/2)throw new Error("grid too short ("+rows.length+" rows)");
  const px=new Uint8ClampedArray(N*N*4);
  for(let y=0;y<N;y++){
    let r=rows[Math.min(y,rows.length-1)].replace(/\s/g,"");
    for(let x=0;x<N;x++){
      const ch=(r[x]??r[r.length-1]??".").toLowerCase();
      const o=(y*N+x)*4;
      if(ch==="."||ch==="_"||ch===" "){px[o+3]=0;continue}
      let idx=HEXCHARS.indexOf(ch);if(idx<0||idx>=pal.length)idx=0;
      const h=pal[idx];
      px[o]=parseInt(h.slice(1,3),16);px[o+1]=parseInt(h.slice(3,5),16);px[o+2]=parseInt(h.slice(5,7),16);px[o+3]=255;
    }
  }
  // blocks (except glass/leaves) must be opaque
  if(name.startsWith("block/")&&!/glass|leaves/.test(name))for(let i=3;i<px.length;i+=4){if(!px[i]){px[i]=255;px[i-1]=pal[0]?parseInt(pal[0].slice(5,7),16):0}}
  Object.assign(t,{w:N,px,palette:pal,status:"done"});
  draw(name);
}

/* ---------- Grid rendering ---------- */
function ensureCard(name){
  let c=document.querySelector(`[data-n="${name}"]`);
  if(c)return c;
  c=document.createElement("div");c.className="card";c.dataset.n=name;
  c.innerHTML=`<canvas width="16" height="16"></canvas><div class="nm">${name}</div><div class="st"></div>
  <input class="note" placeholder="note (optional)" style="font-size:11px;padding:3px 6px;margin-bottom:4px">
  <button class="re">↻ Regenerate</button><div class="palette"></div>`;
  c.querySelector(".note").oninput=e=>{(tex[name]||(tex[name]={})).note=e.target.value};
  c.querySelector(".re").onclick=async()=>{
    if(running)return;running=true;stopFlag=false;
    try{if($("useStyle").checked&&!stylePalette)await makeStyle();await genTexture(name)}
    catch(e){tex[name].status="error";tex[name].err=e.message;draw(name)}
    running=false;refreshButtons();
  };
  $("grid").appendChild(c);return c;
}
function draw(name){
  const t=tex[name],c=ensureCard(name),cv=c.querySelector("canvas"),st=c.querySelector(".st");
  if(t.px){
    cv.width=cv.height=t.w;
    const ctx=cv.getContext("2d");ctx.putImageData(new ImageData(t.px,t.w,t.w),0,0);
    c.querySelector(".palette").innerHTML=t.palette.map(h=>`<i style="background:${h}"></i>`).join("");
  }
  st.className="st"+(t.status==="error"?" err":"");
  st.textContent=t.status==="working"?"generating…":t.status==="error"?t.err:t.status==="done"?"✓":"";
}
function refreshButtons(){
  $("gen").disabled=running;$("stop").disabled=!running;
  $("dl").disabled=!Object.values(tex).some(t=>t.status==="done");
}

/* ---------- Run ---------- */
$("gen").onclick=async()=>{
  const list=[...selected];
  if(!list.length){log("Select at least one texture");return}
  running=true;stopFlag=false;refreshButtons();$("prog").style.width="0";
  try{
    if($("useStyle").checked){log("Designing palette…");await makeStyle()}else stylePalette=null;
    let done=0;
    for(const n of list){
      if(stopFlag)break;
      log("→ "+n);
      try{await genTexture(n)}
      catch(e){
        // one automatic retry for malformed output
        if(!stopFlag&&!/Groq 4(01|03)|API key/.test(e.message)){
          log("  retrying ("+e.message+")");
          try{await genTexture(n)}catch(e2){tex[n].status="error";tex[n].err=e2.message;draw(n);log("  failed: "+e2.message)}
        }else{tex[n].status="error";tex[n].err=e.message;draw(n);log("  failed: "+e.message);if(/401|403|API key/.test(e.message))break}
      }
      done++;$("prog").style.width=(done/list.length*100)+"%";
      refreshButtons();
      await sleep(150);
    }
  }catch(e){log("Error: "+e.message)}
  running=false;refreshButtons();log("Done.");
};
$("stop").onclick=()=>{stopFlag=true;log("Stopping…")};
$("test").onclick=async()=>{
  log("Testing "+modelId()+" …");stopFlag=false;
  try{const r=await groq([{role:"user",content:'Reply with JSON: {"ok":true}'}]);log("Connection OK: "+r.trim().slice(0,60))}
  catch(e){log("Test failed: "+e.message)}
};

/* ---------- Export ---------- */
function toPNG(t,size){
  return new Promise(r=>{
    const c=document.createElement("canvas");c.width=c.height=size;
    const x=c.getContext("2d");x.imageSmoothingEnabled=false;
    const tmp=document.createElement("canvas");tmp.width=tmp.height=t.w;
    tmp.getContext("2d").putImageData(new ImageData(t.px,t.w,t.w),0,0);
    x.drawImage(tmp,0,0,size,size);
    c.toBlob(r,"image/png");
  });
}
$("dl").onclick=async()=>{
  const done=Object.entries(tex).filter(([,t])=>t.status==="done");
  if(!done.length)return;
  const zip=new JSZip();
  const name=$("packName").value.trim()||"AI Pack";
  zip.file("pack.mcmeta",JSON.stringify({pack:{pack_format:+$("ver").value,description:`${name} – AI generated with TexForge (Groq)`}},null,2));
  const icon=done.find(([n])=>/grass_block_side|stone|cobblestone/.test(n))||done[0];
  zip.file("pack.png",await toPNG(icon[1],128));
  for(const [n,t] of done)zip.file(`assets/minecraft/textures/${n}.png`,await toPNG(t,t.w));
  const blob=await zip.generateAsync({type:"blob"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=name.replace(/[^\w\- ]+/g,"").replace(/\s+/g,"_")+".zip";a.click();
  log(`Exported ${done.length} textures. Drop the .zip in .minecraft/resourcepacks`);
};
refreshButtons();
</script>
</body>
</html>
